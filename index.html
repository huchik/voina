<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Симулятор Войны: Оружие в руках</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: monospace; color: white; user-select: none; }
        canvas { image-rendering: pixelated; width: 100vw; height: 100vh; }
        
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.7); font-size: 20px; }
        
        #hud { position: absolute; bottom: 20px; left: 20px; font-size: 18px; text-shadow: 2px 2px 0 #000; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;}
        #cooldown { position: absolute; bottom: 20px; right: 20px; font-size: 18px; color: orange; text-shadow: 2px 2px 0 #000; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;}
        #hint { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; color: yellow; text-shadow: 2px 2px 0 #000; display: none; }
        
        #damageOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: red; opacity: 0; transition: opacity 0.1s; z-index: 5; pointer-events: none; }
        #droneOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; box-shadow: inset 0 0 100px rgba(0,255,0,0.3); border: 2px dashed rgba(0,255,0,0.2); display: none; pointer-events: none; z-index: 6; }
        
        #pauseScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 15; text-align: center; }
        
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,10,15,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; pointer-events: auto; }
        h1 { color: #888; font-size: 40px; text-shadow: 2px 2px 0 #000; margin-bottom: 20px; letter-spacing: 2px; }
        
        .teams-container { display: flex; gap: 50px; }
        .team-box { display: flex; flex-direction: column; align-items: center; padding: 20px; border: 2px solid #333; background: #1a1a1a;}
        .team-red { border-color: #aa3333; }
        .team-blue { border-color: #3333aa; }
        
        .btn { padding: 12px 20px; margin: 10px; font-size: 18px; font-family: monospace; background: #222; color: #ddd; border: 2px solid #555; cursor: pointer; transition: 0.2s; width: 250px;}
        .team-red .btn:hover { background: #552222; border-color: #ff4444; }
        .team-blue .btn:hover { background: #222255; border-color: #4444ff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div id="menu">
        <h1>ВЫБОР СТОРОНЫ</h1>
        <div class="teams-container">
            <div class="team-box team-red">
                <h2 style="color: #ff5555; margin-top: 0;">КРАСНЫЕ</h2>
                <button class="btn" onclick="startGame('red', 'штурмовик')">Штурмовик (Автомат)</button>
                <button class="btn" onclick="startGame('red', 'снайпер')">Снайпер (Винтовка)</button>
            </div>
            <div class="team-box team-blue">
                <h2 style="color: #5555ff; margin-top: 0;">СИНИЕ</h2>
                <button class="btn" onclick="startGame('blue', 'штурмовик')">Штурмовик (Автомат)</button>
                <button class="btn" onclick="startGame('blue', 'снайпер')">Снайпер (Винтовка)</button>
            </div>
        </div>
        <p style="color: gray; margin-top: 40px;">WASD - Ходьба | ЛКМ - Огонь | Q - Запуск FPV Шахеда | F - ПВО</p>
    </div>

    <div id="pauseScreen">
        <h1 style="color: white;">ИГРА НА ПАУЗЕ</h1>
        <p style="font-size: 20px; color: #aaa;">Кликни мышкой в любом месте, чтобы вернуться</p>
    </div>

    <div id="ui" style="display:none;">
        <div id="crosshair">✛</div>
        <div id="droneOverlay">
            <div style="position:absolute; top:20px; left:20px; color:lime;">FPV CAM - REC</div>
            <div style="position:absolute; bottom:20px; left:50%; transform:translateX(-50%); color:lime;">ЛЕТИ В ЦЕЛЬ ДЛЯ ПОДРЫВА</div>
        </div>
        <div id="hud">
            Команда: <span id="teamDisplay">...</span> | 
            Класс: <span id="classDisplay">...</span> <br><br>
            HP: <span id="hpDisplay" style="color:lime; font-size: 24px; font-weight: bold;">100</span> | 
            ПВО: <span id="pvoStatus">НЕТ</span>
        </div>
        <div id="cooldown">Шахед: [ ГОТОВ ]</div>
        <div id="hint">Нажми F</div>
    </div>
    <div id="damageOverlay"></div>

    <script>
        // ==========================================
        // 1. ВСТАВЬ СЮДА СВОЙ КОНФИГ FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyANRufTuyTUYgMmV7Dx5_b8budZNrrkCJs",
            authDomain: "voina-e459e.firebaseapp.com",
            databaseURL: "https://voina-e459e-default-rtdb.firebaseio.com",
            projectId: "voina-e459e",
            storageBucket: "voina-e459e.firebasestorage.app",
            messagingSenderId: "226646836207",
            appId: "1:226646836207:web:87fc0bbb8f38e2bd5b6c1a"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ==========================================
        // 2. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
        // ==========================================
        const myId = Math.random().toString(36).substring(2, 9);
        let myTeam = 'red';
        let myClass = 'штурмовик';
        let myHp = 100;
        let inGame = false;
        let isPaused = false; 
        
        let controlMode = 'player'; 
        let inPvoId = null; 
        
        let lastDroneTime = -20000;
        const DRONE_COOLDOWN = 20000;

        let myUnit = { x: 0, z: 0 };
        let shahedUnit = { x: 0, y: 0, z: 0 };
        
        const speed = 0.12;
        const playerHeight = 1.6;
        let headBobTimer = 0;

        let yaw = 0;
        let pitch = 0;

        // Переменные для отдачи оружия
        let recoilOffset = 0;
        let recoilTarget = 0;

        const spawnPoints = {
            'red': [{x: -20, z: 80}, {x: 0, z: 80}, {x: 20, z: 80}, {x: -10, z: 85}, {x: 10, z: 85}],
            'blue': [{x: -20, z: -80}, {x: 0, z: -80}, {x: 20, z: -80}, {x: -10, z: -85}, {x: 10, z: -85}]
        };

        function getSpawn(team) {
            let pts = spawnPoints[team];
            return pts[Math.floor(Math.random() * pts.length)];
        }

        // ==========================================
        // 3. 3D СЦЕНА
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a2a2a);
        scene.fog = new THREE.FogExp2(0x2a2a2a, 0.015);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
        scene.add(camera); // ВАЖНО: Добавляем камеру на сцену, чтобы прикрепленное к ней оружие было видно

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setPixelRatio(0.3);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x444444));
        const dirLight = new THREE.DirectionalLight(0x777766, 0.8);
        dirLight.position.set(20, 50, 20);
        scene.add(dirLight);

        // ==========================================
        // ОРУЖИЕ ОТ ПЕРВОГО ЛИЦА (FPS WEAPON)
        // ==========================================
        const fpsWeaponGroup = new THREE.Group();
        camera.add(fpsWeaponGroup); // Привязываем оружие жестко к камере

        function buildFpsWeapon(cls) {
            // Очищаем старое оружие (если сменили класс)
            while(fpsWeaponGroup.children.length > 0) { 
                fpsWeaponGroup.remove(fpsWeaponGroup.children[0]); 
            }
            
            const matDark = new THREE.MeshStandardMaterial({color: 0x1a1a1a, roughness: 0.8});
            const matWood = new THREE.MeshStandardMaterial({color: 0x5c4033, roughness: 0.9}); // Цвет дерева

            if (cls === 'снайпер') {
                // Снайперская винтовка (длинная, с оптикой и деревянным прикладом)
                const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 1.2), matDark);
                barrel.position.set(0, 0, -0.4);
                const stock = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.12, 0.8), matWood);
                stock.position.set(0, -0.04, 0.3);
                const scope = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.3).rotateX(Math.PI/2), matDark);
                scope.position.set(0, 0.05, 0.1);
                fpsWeaponGroup.add(barrel, stock, scope);
            } else {
                // Штурмовой автомат (короткий, черный, с магазином)
                const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.8), matDark);
                barrel.position.set(0, 0, -0.2);
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.5), matDark);
                body.position.set(0, -0.03, 0.1);
                const mag = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.2, 0.12), matDark);
                mag.position.set(0, -0.15, 0.1);
                fpsWeaponGroup.add(barrel, body, mag);
            }
            // Позиция оружия относительно глаз игрока (Справа, внизу, выдвинуто вперед)
            fpsWeaponGroup.position.set(0.35, -0.3, -0.5); 
        }

        // ==========================================
        // 4. ГЕНЕРАЦИЯ КАРТЫ
        // ==========================================
        const mapData = []; 
        const wallsGroup = new THREE.Group();
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x3d352b, roughness: 1 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);
        const buildingMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.9 });
        
        function pseudoRandom(x, z) {
            let n = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453; return n - Math.floor(n);
        }

        for(let i = -30; i <= 30; i+=3) {
            for(let j = -30; j <= 30; j+=3) {
                if (j * 3 < -70 || j * 3 > 70) continue; 
                let rand = pseudoRandom(i, j);
                if (rand > 0.6) {
                    let w = 2 + pseudoRandom(i+1, j) * 4; let h = 1 + pseudoRandom(i, j+1) * 6; let d = 2 + pseudoRandom(i+2, j) * 4;
                    let mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMat);
                    mesh.position.set(i * 3, h/2, j * 3); wallsGroup.add(mesh);
                    mapData.push({ x: i*3, z: j*3, w: w, d: d, h: h });
                }
            }
        }
        scene.add(wallsGroup);

        function checkCollision(nx, nz, isDrone = false, ny = 0) {
            if (nx < -95 || nx > 95 || nz < -95 || nz > 95) return true;
            for(let b of mapData) {
                if (Math.abs(nx - b.x) < (b.w/2 + 0.5) && Math.abs(nz - b.z) < (b.d/2 + 0.5)) {
                    if (isDrone) { if (ny < b.h) return true; } else { return true; }
                }
            }
            return false;
        }

        // ==========================================
        // 5. МОДЕЛИ ИГРОКОВ, ПВО, ДРОНОВ
        // ==========================================
        function createPlayerModel(team) {
            const group = new THREE.Group();
            let color = team === 'red' ? 0xaa3333 : 0x3333aa;
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.4), new THREE.MeshStandardMaterial({ color: color }));
            body.position.y = 0.6;
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshStandardMaterial({ color: 0xddaa88 }));
            head.position.y = 1.4;
            const gun = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.8), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            gun.position.set(0.3, 0.9, -0.4); 
            group.add(body); group.add(head); group.add(gun);
            return group;
        }

        function createPvoModel() {
            const group = new THREE.Group();
            const base = new THREE.Mesh(new THREE.BoxGeometry(3, 1.5, 3), new THREE.MeshStandardMaterial({ color: 0x223322 }));
            base.position.y = 0.75;
            const turret = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1, 1.5), new THREE.MeshStandardMaterial({ color: 0x334433 }));
            turret.position.y = 1.75; turret.name = "turret";
            const m1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 2), new THREE.MeshStandardMaterial({color: 0x111}));
            m1.position.set(-0.6, 0.6, -0.5);
            const m2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 2), new THREE.MeshStandardMaterial({color: 0x111}));
            m2.position.set(0.6, 0.6, -0.5);
            turret.add(m1); turret.add(m2); group.add(base); group.add(turret);
            return group;
        }

        // ==========================================
        // 6. СЕТЬ
        // ==========================================
        const playerMeshes = {};
        db.ref('players').on('value', snap => {
            const players = snap.val() || {};
            for (let id in playerMeshes) {
                if (!players[id] || players[id].inPvo) { scene.remove(playerMeshes[id]); delete playerMeshes[id]; }
            }
            for (let id in players) {
                if (id === myId || players[id].inPvo) continue;
                let p = players[id];
                if (!playerMeshes[id]) {
                    playerMeshes[id] = createPlayerModel(p.team); scene.add(playerMeshes[id]);
                }
                playerMeshes[id].position.set(p.x, 0, p.z); playerMeshes[id].rotation.y = p.yaw; playerMeshes[id].children[1].rotation.x = p.pitch;
            }
        });

        const pvoSpots = [{id: 'pvo_red', x: 0, z: 60}, {id: 'pvo_blue', x: 0, z: -60}];
        const pvoMeshes = {};
        pvoSpots.forEach(spot => {
            let m = createPvoModel(); m.position.set(spot.x, 0, spot.z); scene.add(m); pvoMeshes[spot.id] = m;
        });

        db.ref('pvos').on('value', snap => {
            const serverPvos = snap.val() || {};
            for (let id in serverPvos) {
                if (pvoMeshes[id] && serverPvos[id].yaw !== undefined) {
                    let turret = pvoMeshes[id].getObjectByName("turret");
                    turret.rotation.y = serverPvos[id].yaw; turret.rotation.x = serverPvos[id].pitch;
                }
            }
        });

        // ==========================================
        // 7. СИСТЕМА УРОНА
        // ==========================================
        function updateHpUi() {
            let hpElement = document.getElementById('hpDisplay'); hpElement.innerText = myHp;
            if (myHp > 60) hpElement.style.color = "lime";
            else if (myHp > 30) hpElement.style.color = "orange"; else hpElement.style.color = "red";
        }

        function takeDamage(dmg) {
            myHp -= dmg; updateHpUi();
            let overlay = document.getElementById('damageOverlay'); overlay.style.opacity = '0.6';
            setTimeout(() => overlay.style.opacity = '0', 150);
            if (myHp <= 0) die();
        }

        function die() {
            if (controlMode === 'shahed') {
                document.getElementById('droneOverlay').style.display = 'none'; document.getElementById('hud').style.display = 'block';
                document.getElementById('crosshair').innerText = '✛'; db.ref('drones/' + myId).remove();
            }
            if (controlMode === 'pvo') {
                db.ref('pvos/' + inPvoId).update({owner: null}); inPvoId = null;
                document.getElementById('pvoStatus').innerText = "НЕТ"; db.ref('players/' + myId).update({inPvo: false});
            }
            controlMode = 'player'; myHp = 100; updateHpUi();
            let spawn = getSpawn(myTeam); myUnit.x = spawn.x; myUnit.z = spawn.z;
        }

        // ==========================================
        // 8. ОРУЖИЕ И ШАХЕДЫ
        // ==========================================
        let activeBullets = {}; let activeDrones = {}; let explosions = []; let lastShootTime = 0;

        function shoot() {
            if (controlMode === 'shahed' || isPaused) return; 
            let now = Date.now();
            let fireDelay = (myClass === 'штурмовик') ? 120 : 700; let dmg = (myClass === 'снайпер') ? 50 : 20;
            if (controlMode === 'pvo') { fireDelay = 200; dmg = 30; }
            if (now - lastShootTime < fireDelay) return;
            lastShootTime = now;
            
            // Задаем цель для отдачи (Оружие дергается назад)
            recoilTarget = (myClass === 'снайпер') ? 0.3 : 0.15; 

            let dir = new THREE.Vector3(); camera.getWorldDirection(dir);
            let bSpeed = (myClass === 'снайпер') ? 3.0 : 1.5; if (controlMode === 'pvo') bSpeed = 3.5; 
            let bId = 'b_' + myId + '_' + now;
            db.ref('bullets/' + bId).set({
                owner: myId, team: myTeam, dmg: dmg, 
                x: camera.position.x, y: camera.position.y, z: camera.position.z,
                vx: dir.x * bSpeed, vy: dir.y * bSpeed, vz: dir.z * bSpeed, isPvo: controlMode === 'pvo'
            });
            setTimeout(() => db.ref('bullets/' + bId).remove(), 1500);
        }

        db.ref('bullets').on('child_added', snap => {
            let b = snap.val();
            let bColor = b.isPvo ? 0x00ff00 : (b.team === 'red' ? 0xff5555 : 0x5555ff);
            let mesh = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.8), new THREE.MeshBasicMaterial({ color: bColor }));
            mesh.position.set(b.x, b.y, b.z); mesh.lookAt(b.x + b.vx, b.y + b.vy, b.z + b.vz);
            scene.add(mesh); activeBullets[snap.key] = { data: b, mesh: mesh };
        });
        db.ref('bullets').on('child_removed', snap => {
            if (activeBullets[snap.key]) { scene.remove(activeBullets[snap.key].mesh); delete activeBullets[snap.key]; }
        });

        function launchShahed() {
            if (controlMode !== 'player' || isPaused) return;
            if (Date.now() - lastDroneTime < DRONE_COOLDOWN) return;
            controlMode = 'shahed'; shahedUnit.x = myUnit.x; shahedUnit.y = playerHeight + 1; shahedUnit.z = myUnit.z;
            document.getElementById('droneOverlay').style.display = 'block'; document.getElementById('hud').style.display = 'none';
            document.getElementById('crosshair').innerText = '[- + -]';
        }

        function explodeShahed() {
            controlMode = 'player'; lastDroneTime = Date.now();
            document.getElementById('droneOverlay').style.display = 'none'; document.getElementById('hud').style.display = 'block';
            document.getElementById('crosshair').innerText = '✛';
            db.ref('explosions').push({ x: shahedUnit.x, y: shahedUnit.y, z: shahedUnit.z, team: myTeam });
            db.ref('drones/' + myId).remove();
        }

        db.ref('drones').on('value', snap => {
            let drones = snap.val() || {};
            for (let id in activeDrones) { if (!drones[id]) { scene.remove(activeDrones[id].mesh); delete activeDrones[id]; } }
            for (let id in drones) {
                if (id === myId) continue; let d = drones[id];
                if (!activeDrones[id]) {
                    const group = new THREE.Group();
                    group.add(new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.5, 8).rotateX(-Math.PI/2), new THREE.MeshStandardMaterial({ color: 0x888888 })));
                    let wing = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1, 3).rotateX(-Math.PI/2), new THREE.MeshStandardMaterial({ color: 0x888888 }));
                    wing.position.z = 0.3; group.add(wing); activeDrones[id] = { mesh: group }; scene.add(activeDrones[id].mesh);
                }
                activeDrones[id].mesh.position.set(d.x, d.y, d.z);
                activeDrones[id].mesh.rotation.y = d.yaw; activeDrones[id].mesh.rotation.x = d.pitch;
            }
        });

        db.ref('explosions').on('child_added', snap => {
            let exp = snap.val();
            if (exp.team !== myTeam && controlMode !== 'shahed') {
                let dist = Math.sqrt(Math.pow(myUnit.x - exp.x, 2) + Math.pow(myUnit.z - exp.z, 2));
                if (dist < 6) takeDamage(100); else if (dist < 12) takeDamage(50);
            }
            let mesh = new THREE.Mesh(new THREE.SphereGeometry(2, 16, 16), new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.8 }));
            mesh.position.set(exp.x, exp.y, exp.z); scene.add(mesh);
            explosions.push({ mesh: mesh, life: 1.0 });
            setTimeout(() => snap.ref.remove(), 2000); 
        });

        // ==========================================
        // 9. ВВОД
        // ==========================================
        const keys = {};
        window.addEventListener('keydown', e => { 
            keys[e.code] = true; 
            if (e.code === 'KeyF' && inGame && controlMode !== 'shahed' && !isPaused) {
                if (controlMode === 'pvo') {
                    db.ref('pvos/' + inPvoId).update({owner: null});
                    myUnit.x = pvoMeshes[inPvoId].position.x - 3; myUnit.z = pvoMeshes[inPvoId].position.z;
                    controlMode = 'player'; inPvoId = null;
                    document.getElementById('pvoStatus').innerText = "НЕТ"; db.ref('players/' + myId).update({inPvo: false});
                } else {
                    for (let id in pvoMeshes) {
                        if (Math.sqrt(Math.pow(myUnit.x - pvoMeshes[id].position.x, 2) + Math.pow(myUnit.z - pvoMeshes[id].position.z, 2)) < 4) {
                            controlMode = 'pvo'; inPvoId = id; db.ref('pvos/' + id).update({owner: myId});
                            document.getElementById('pvoStatus').innerText = "АКТИВНО"; db.ref('players/' + myId).update({inPvo: true});
                            break;
                        }
                    }
                }
            }
            if (e.code === 'KeyQ' && inGame && !isPaused) launchShahed();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        document.addEventListener('pointerlockchange', () => {
            if (inGame) {
                if (document.pointerLockElement === document.body) {
                    isPaused = false; document.getElementById('pauseScreen').style.display = 'none';
                } else {
                    isPaused = true; document.getElementById('pauseScreen').style.display = 'flex';
                    for(let k in keys) keys[k] = false;
                }
            }
        });

        window.addEventListener('mousedown', e => { 
            if (!inGame) return;
            if (document.pointerLockElement !== document.body) {
                document.body.requestPointerLock();
            } else { shoot(); }
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body && !isPaused) {
                yaw -= e.movementX * 0.002; pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
            }
        });

        // ==========================================
        // 10. ИГРОВОЙ ЦИКЛ
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            if (!inGame || isPaused) return;

            // Логика кулдауна Шахеда
            if (controlMode !== 'shahed') {
                if (Date.now() - lastDroneTime >= DRONE_COOLDOWN) {
                    document.getElementById('cooldown').innerText = "Шахед: [ ГОТОВ (Q) ]"; document.getElementById('cooldown').style.color = "lime";
                } else {
                    let left = Math.ceil((DRONE_COOLDOWN - (Date.now() - lastDroneTime))/1000);
                    document.getElementById('cooldown').innerText = `Шахед: [ ${left}с ]`; document.getElementById('cooldown').style.color = "red";
                }
            }

            fpsWeaponGroup.visible = (controlMode === 'player'); // Прячем пушку в ПВО и дроне

            if (controlMode === 'shahed') {
                let sSpeed = 0.2; 
                let forward = new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                shahedUnit.x += forward.x * sSpeed; shahedUnit.y += forward.y * sSpeed; shahedUnit.z += forward.z * sSpeed;
                camera.position.set(shahedUnit.x, shahedUnit.y, shahedUnit.z);
                
                if (shahedUnit.y <= 0.2 || checkCollision(shahedUnit.x, shahedUnit.z, true, shahedUnit.y)) explodeShahed();
                else db.ref('drones/' + myId).set({ x: shahedUnit.x, y: shahedUnit.y, z: shahedUnit.z, yaw: yaw, pitch: pitch });
            } 
            else if (controlMode === 'pvo') {
                let pvo = pvoMeshes[inPvoId]; camera.position.set(pvo.position.x, 3.5, pvo.position.z);
                db.ref('pvos/' + inPvoId).update({ yaw: yaw, pitch: pitch }); document.getElementById('hint').style.display = 'none';
            } 
            else {
                let dx = 0, dz = 0;
                let forward = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
                let right = new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);

                if (keys['KeyW']) { dx += forward.x * speed; dz += forward.z * speed; }
                if (keys['KeyS']) { dx -= forward.x * speed; dz -= forward.z * speed; }
                if (keys['KeyA']) { dx -= right.x * speed; dz -= right.z * speed; }
                if (keys['KeyD']) { dx += right.x * speed; dz += right.z * speed; }

                if (!checkCollision(myUnit.x + dx, myUnit.z)) myUnit.x += dx;
                if (!checkCollision(myUnit.x, myUnit.z + dz)) myUnit.z += dz;

                // Анимация оружия (Покачивание при ходьбе + Отдача при выстреле)
                let swayX = 0; let swayY = 0;
                if (dx !== 0 || dz !== 0) {
                    headBobTimer += 0.2; 
                    camera.position.set(myUnit.x, playerHeight + Math.abs(Math.sin(headBobTimer)) * 0.15, myUnit.z);
                    swayX = Math.sin(headBobTimer * 0.5) * 0.02; // Оружие качается влево-вправо
                    swayY = Math.abs(Math.sin(headBobTimer)) * 0.02; // Оружие качается вверх-вниз
                } else {
                    camera.position.set(myUnit.x, playerHeight, myUnit.z);
                }

                // Плавное возвращение оружия на место после выстрела
                recoilOffset += (recoilTarget - recoilOffset) * 0.2; // Плавность отдачи
                recoilTarget *= 0.8; // Затухание отдачи
                
                // Применяем позицию и поворот к оружию
                fpsWeaponGroup.position.set(0.35 + swayX, -0.3 + swayY, -0.5 + recoilOffset);
                fpsWeaponGroup.rotation.x = recoilOffset * 0.5; // Ствол немного задирается вверх

                db.ref('players/' + myId).update({ x: myUnit.x, z: myUnit.z, yaw: yaw, pitch: pitch, team: myTeam });

                let canSit = false;
                for (let id in pvoMeshes) {
                    if (Math.sqrt(Math.pow(myUnit.x - pvoMeshes[id].position.x, 2) + Math.pow(myUnit.z - pvoMeshes[id].position.z, 2)) < 4) canSit = true;
                }
                document.getElementById('hint').style.display = canSit ? 'block' : 'none';
            }

            let euler = new THREE.Euler(0, 0, 0, 'YXZ'); euler.x = pitch; euler.y = yaw;
            camera.quaternion.setFromEuler(euler);

            for (let id in activeBullets) {
                let b = activeBullets[id]; b.mesh.position.x += b.data.vx; b.mesh.position.y += b.data.vy; b.mesh.position.z += b.data.vz;
                if (b.data.team !== myTeam && controlMode !== 'shahed') {
                    let hitRadius = controlMode === 'pvo' ? 2.5 : 1.2;
                    if (camera.position.distanceTo(b.mesh.position) < hitRadius) { takeDamage(b.data.dmg); db.ref('bullets/' + id).remove(); }
                }
            }

            for (let i = explosions.length - 1; i >= 0; i--) {
                let exp = explosions[i]; exp.life -= 0.05;
                exp.mesh.scale.set(1 + (1-exp.life)*5, 1 + (1-exp.life)*5, 1 + (1-exp.life)*5);
                exp.mesh.material.opacity = exp.life;
                if (exp.life <= 0) { scene.remove(exp.mesh); explosions.splice(i, 1); }
            }

            renderer.render(scene, camera);
        }

        window.startGame = function(team, selectedClass) {
            myTeam = team; myClass = selectedClass;
            document.getElementById('teamDisplay').innerText = (myTeam === 'red') ? "КРАСНЫЕ" : "СИНИЕ";
            document.getElementById('teamDisplay').style.color = (myTeam === 'red') ? "#ff5555" : "#5555ff";
            document.getElementById('classDisplay').innerText = myClass.toUpperCase();
            
            document.getElementById('menu').style.display = 'none'; document.getElementById('ui').style.display = 'block';
            
            buildFpsWeapon(myClass); // Создаем 3D модель пушки в руках!

            let spawn = getSpawn(myTeam); myUnit.x = spawn.x; myUnit.z = spawn.z;
            db.ref('players/' + myId).set({ x: myUnit.x, z: myUnit.z, yaw: 0, pitch: 0, inPvo: false, team: myTeam });
            db.ref('players/' + myId).onDisconnect().remove();

            inGame = true; document.body.requestPointerLock(); animate();
        };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
